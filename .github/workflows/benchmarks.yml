# Benchmark tracking (TASK-075): runs bench/errorset.bench.ts on demand and weekly, and
# keeps each result as a JSON artifact. Timings on shared runners are noisy; compare
# runs with each other and with bench/baseline-0.3.0.json, not as pass/fail gates.
name: benchmarks

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Benchmark processes per case (the per-case median is recorded)"
        required: false
        default: "3"
  schedule:
    # Mondays 06:17 UTC
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Run benchmarks
        env:
          RUNS: ${{ inputs.runs || '3' }}
        run: bun run bench --runs "$RUNS" --json "bench-${GITHUB_SHA}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.sha }}-${{ github.run_number }}
          path: bench-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 90
