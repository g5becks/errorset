name: CI

# Mirrored by scripts/ci-local.sh. Any change here must be made there in the same commit.

on:
  push:
    branches: [ main, "release/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        bun: [ "1.3.14", "1.4.4", latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage
      - run: bun run build
      - run: bun run test:types
      - run: bun run test:consumer
        env:
          SMOKE_NODE: skip

  typescript:
    strategy:
      fail-fast: false
      matrix:
        include:
          - typescript: "5.9.3"
            experimental: false
          - typescript: "6.0.3"
            experimental: false
          - typescript: "7.0.2"
            experimental: false
          - typescript: "7.1.0-beta"
            experimental: true
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx -p typescript@${{ matrix.typescript }} tsc --noEmit
      - run: bunx -p typescript@${{ matrix.typescript }} tsc --noEmit -p tests/types/tsconfig.json

  node:
    strategy:
      fail-fast: false
      matrix:
        node: [ "22", "lts/*" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/node-import-check.mjs
      - run: bun run test:consumer
        env:
          SMOKE_NODE: require
