name: Release

# Publishes a pushed v* tag to npm with trusted publishing (OIDC, no NPM_TOKEN) and
# provenance. The npm package must list this repository and workflow as a trusted
# publisher. Not mirrored in scripts/ci-local.sh: publishing only happens on GitHub.

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # Node 24 ships an npm CLI that supports trusted publishing (>= 11.5.1).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify tag matches package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(bun -p 'require("./package.json").version')
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage
      - run: bun run build
      - run: bun run test:types
      - run: bun run test:consumer
        env:
          SMOKE_NODE: require
      - name: Check whether the version is already published
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          result="$RUNNER_TEMP/registry.json"
          if npm view "@takinprofit/errorset@$RELEASE_VERSION" version --json > "$result"; then
            bun -e 'if (JSON.parse(await Bun.file(process.argv[1]).text()) !== process.env.RELEASE_VERSION) process.exit(1)' "$result"
            echo "::notice::@takinprofit/errorset@$RELEASE_VERSION is already on npm; skipping publication"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            # Only a missing version permits publication; registry or network errors fail.
            bun -e 'if (JSON.parse(await Bun.file(process.argv[1]).text()).error?.code !== "E404") process.exit(1)' "$result"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack and publish with OIDC and provenance
        if: steps.registry.outputs.published == 'false'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tarball="takinprofit-errorset-$RELEASE_VERSION.tgz"
          bun pm pack --filename "$tarball"
          npm publish "./$tarball" --provenance --access public
